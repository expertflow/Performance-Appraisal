<div class="page-header">
  <div>
    <h1>Change Password</h1>
    <p>Update your account password</p>
  </div>
  <a routerLink="/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
</div>

<div class="card change-pw-card">
  @if (user) {
    <div class="user-info-row">
      <div class="user-avatar">{{ user.name.charAt(0).toUpperCase() }}</div>
      <div>
        <div class="user-name">{{ user.name }}</div>
        <div class="user-email">{{ user.email }}</div>
        <span class="role-badge role-{{ user.role.toLowerCase() }}">{{ user.role }}</span>
      </div>
    </div>
  }

  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }
  @if (success()) {
    <div class="alert alert-success">{{ success() }} Redirecting…</div>
  }

  <form (ngSubmit)="submit()" style="max-width: 420px;">
    <div class="form-group">
      <label class="form-label" for="current-pw">Current Password <span style="color:var(--color-red)">*</span></label>
      <input id="current-pw" type="password" class="form-control"
             [(ngModel)]="currentPassword" name="currentPassword"
             placeholder="Enter current password" autocomplete="current-password">
    </div>

    <div class="form-group">
      <label class="form-label" for="new-pw">New Password <span style="color:var(--color-red)">*</span></label>
      <input id="new-pw" type="password" class="form-control"
             [(ngModel)]="newPassword" name="newPassword"
             placeholder="At least 8 characters" autocomplete="new-password">
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm-pw">Confirm New Password <span style="color:var(--color-red)">*</span></label>
      <input id="confirm-pw" type="password" class="form-control"
             [(ngModel)]="confirmPassword" name="confirmPassword"
             placeholder="Repeat new password" autocomplete="new-password">
    </div>

    <div class="form-actions">
      <a routerLink="/dashboard" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" style="width:14px;height:14px;border-width:2px;"></span>
          Saving…
        } @else {
          Update Password
        }
      </button>
    </div>
  </form>
</div>
